<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13263c"><title>WingOps Staff</title><link rel="manifest" href="/static/manifest.json"><style>body{font-family:system-ui,Arial;background:#edf2f7;margin:0;color:#13263c}main{max-width:760px;margin:24px auto;padding:18px}.panel{background:white;padding:28px;border-radius:18px;box-shadow:0 4px 20px #17283a16}h1{font-size:28px}input,textarea,button{font:inherit;box-sizing:border-box}input,textarea{padding:14px;width:100%;border:1px solid #c5ced8;border-radius:9px;margin:7px 0 16px}button{background:#173e64;color:white;border:0;border-radius:10px;padding:15px 22px;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.task{display:flex;align-items:center;gap:16px;padding:18px 10px;border-bottom:1px solid #e5eaf0;font-size:17px}.task input{width:25px;height:25px;margin:0;flex:none}.muted{color:#62748b}.hidden{display:none}.success{background:#e0f5e6;padding:14px;border-radius:9px;color:#17542b}.error{color:#a51b1b}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}small{color:#5a6a80}</style></head><body><main><div class="panel"><div class="top"><h1>🍗 WingOps</h1><a href="/install">Install</a></div><p class="muted">Staff attendance & opening checklist</p><section id="login"><h2>Clock in</h2><label>Employee number</label><input id="eid" type="number" inputmode="numeric" placeholder="e.g. 1"><label>PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="Your PIN"><button onclick="login()">Clock in / Sign in</button><p id="loginError" class="error"></p></section><section id="work" class="hidden"><h2 id="welcome"></h2><p id="clock"></p><h3>Opening checklist</h3><p class="muted">Complete all items, then submit. Attach one kitchen photo. The server will save the checklist and photo.</p><div id="tasks"></div><label>Kitchen photo (required)</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="update()"><label>Notes for owner</label><textarea id="notes" rows="3" placeholder="Issues, shortages, repairs needed..."></textarea><button id="submit" onclick="submitReport()" disabled>Submit opening report</button> <button style="background:#65758a" onclick="clockOut()">Clock out</button><p id="result"></p></section></div></main><script>let token=sessionStorage.getItem('wing_token')||'';let tasks=[];let checklistRevision=1;const el=id=>document.getElementById(id);async function api(path,method='GET',body){let r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Employee-Token':token},body:body?JSON.stringify(body):undefined});let data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');return data}async function login(){try{let d=await api('/api/login','POST',{employee_id:Number(el('eid').value),pin:el('pin').value});token=d.token;sessionStorage.setItem('wing_token',token);showWork(d)}catch(e){el('loginError').textContent=e.message}}async function showWork(d){el('login').classList.add('hidden');el('work').classList.remove('hidden');el('welcome').textContent=d.store+' — '+d.name;el('clock').textContent='Clocked in: '+new Date(d.clock_in).toLocaleString();let config=await api('/api/config');tasks=config.tasks;checklistRevision=config.revision;el('tasks').innerHTML='';tasks.forEach((t,i)=>{let l=document.createElement('label');l.className='task';let input=document.createElement('input');input.type='checkbox';input.className='check';input.addEventListener('change',update);let span=document.createElement('span');span.textContent=(i+1)+'. '+t;l.append(input,span);el('tasks').append(l)});update()}function update(){el('submit').disabled=![...document.querySelectorAll('.check')].every(x=>x.checked)||!el('photo').files.length}async function submitReport(){let btn=el('submit');btn.disabled=true;try{let form=new FormData();form.append('checks_json',JSON.stringify([...document.querySelectorAll('.check')].map(x=>x.checked)));form.append('notes',el('notes').value);form.append('revision',String(checklistRevision));form.append('photo',el('photo').files[0]);let r=await fetch('/api/submit',{method:'POST',headers:{'X-Employee-Token':token},body:form});let d=await r.json();if(!r.ok)throw Error(d.detail||'Submission failed');el('result').className='success';el('result').textContent='Saved on server! Report #'+d.submission_id+' at '+new Date(d.submitted_at).toLocaleString();}catch(e){el('result').className='error';el('result').textContent=e.message}finally{update()}}async function clockOut(){if(!confirm('Clock out now?'))return;try{await api('/api/clock-out','POST');sessionStorage.removeItem('wing_token');location.reload()}catch(e){alert(e.message)}}if(token)api('/api/me').then(showWork).catch(()=>sessionStorage.removeItem('wing_token'));</script></body></html>
